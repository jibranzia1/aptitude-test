<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Results Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F0EB; --card:#FFFFFF; --ink:#1A1A1A; --red:#C0392B;
    --steel:#8C8C8C; --leather:#8B4513; --olive:#4A6B4F;
    --display:"Bebas Neue", "Arial Narrow", Impact, sans-serif;
    --data:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --body:Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;
    -webkit-font-smoothing:antialiased;padding:0 16px 90px}
  .wrap{max-width:1040px;margin:0 auto}
  .mast{border-bottom:3px solid var(--ink);padding:22px 0 12px;margin-bottom:26px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .mast h1{font-family:var(--display);font-size:clamp(32px,6vw,52px);line-height:.9;margin:0;font-weight:400}
  .mast .sub{font-family:var(--data);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-top:8px}
  .serial{font-family:var(--data);font-size:10.5px;letter-spacing:.16em;color:var(--steel);text-align:right;text-transform:uppercase}
  .card{background:var(--card);border:2px solid var(--ink);padding:26px}
  .cardhead{background:var(--ink);color:var(--paper);font-family:var(--display);font-size:20px;
    letter-spacing:.08em;padding:9px 26px;margin:-26px -26px 22px}
  .label{font-family:var(--data);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel)}
  .muted{color:var(--steel)}
  .seq{font-family:var(--data);font-weight:700}
  label{display:block;font-family:var(--data);font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--steel);margin-bottom:9px}
  input{width:100%;background:var(--paper);border:2px solid var(--ink);color:var(--ink);
    padding:14px;font-size:16px;font-family:var(--body);border-radius:0}
  input:focus{outline:none;border-color:var(--red)}
  .err{color:var(--red);font-family:var(--data);font-size:12px;margin-top:12px;min-height:16px}
  .btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:0;
    padding:12px 26px;font-family:var(--display);font-size:16px;letter-spacing:.1em;cursor:pointer;
    transition:background .12s ease,color .12s ease}
  .btn:hover{background:var(--red);border-color:var(--red)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  :focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    border:2px solid var(--ink);background:var(--ink);gap:2px;margin-bottom:22px}
  .stat{background:var(--card);padding:16px 18px}
  .stat b{display:block;font-family:var(--display);font-size:42px;line-height:.9}
  .stat span{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);
    text-align:left;font-weight:400;padding:10px 8px;border-bottom:2px solid var(--ink);cursor:pointer;user-select:none}
  th:hover{color:var(--red)}
  td{padding:12px 8px;border-bottom:1px solid #E2DAD1;font-family:var(--body)}
  td.n{font-family:var(--data);font-size:13.5px}
  tr.row{cursor:pointer}
  tr.row:hover td{background:#F0EAE2}
  .pill{font-family:var(--data);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    padding:4px 9px;border:1.5px solid currentColor;white-space:nowrap}
  .flag{color:var(--red);font-family:var(--data);font-weight:700}
  .stamp{display:inline-block;border:3px double currentColor;font-family:var(--display);
    font-size:clamp(22px,4vw,30px);letter-spacing:.1em;padding:7px 18px 4px;transform:rotate(-4deg);
    box-shadow:inset 0 0 0 1px currentColor;opacity:.9}
  .bigscore{font-family:var(--display);font-size:86px;line-height:.8}
  .bigscore small{font-size:24px;color:var(--steel)}
  .verdict{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .rev{border-left:5px solid var(--steel);background:var(--card);border-top:1px solid #E2DAD1;
    border-right:1px solid #E2DAD1;border-bottom:1px solid #E2DAD1;padding:16px 18px;margin-bottom:14px}
  .rev.good{border-left-color:var(--olive)}
  .rev.bad{border-left-color:var(--red)}
  .rev h4{margin:8px 0 12px;font-size:16px;font-weight:normal;font-family:var(--body)}
  .rev .opt{font-family:var(--data);font-size:12.5px;padding:4px 0;color:#6B6259}
  .rev .opt.correct{color:var(--olive);font-weight:700}
  .rev .opt.chosen{color:var(--red);font-weight:700}
  .rev .opt.both{color:var(--olive);font-weight:700}
  .tag{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
  .tag.good{color:var(--olive)}
  .tag.bad{color:var(--red)}
  .why{color:#6B6259;font-size:14px;font-style:italic;margin:12px 0 0}
  .warn{display:inline-block;font-family:var(--data);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--red);border:1.5px solid var(--red);padding:3px 7px;white-space:nowrap}
  .signals{border:2px solid var(--red);border-left-width:9px;background:#FBF1EF;padding:16px 18px;margin:22px 0 0}
  .signals .h{font-family:var(--display);font-size:19px;letter-spacing:.06em;color:var(--red);margin-bottom:6px}
  .signals ul{list-style:none;padding:0;margin:8px 0 0}
  .signals li{display:flex;gap:10px;font-size:14px;padding:4px 0;line-height:1.5}
  .signals li::before{content:"\2192";color:var(--red)}
  .signals .cool{font-family:var(--data);font-size:11px;color:#6B6259;margin-top:12px;letter-spacing:.03em;line-height:1.6}
  .clean{color:var(--olive);font-family:var(--data);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .hide{display:none}
  @media (max-width:660px){
    .card{padding:18px}
    .cardhead{margin:-18px -18px 18px;padding:8px 18px}
    td,th{padding:9px 5px;font-size:13.5px}
    .hcol{display:none}
    .bigscore{font-size:64px}
  }
</style>

<div class="wrap">

  <div class="mast">
    <div>
      <h1>Results Ledger</h1>
      <div class="sub" id="sub">Private &middot; admin access only</div>
    </div>
    <div class="serial">Form AR-20<br>Assessor copy</div>
  </div>

  <section id="login">
    <div class="card" style="max-width:470px">
      <div class="cardhead">Sign in</div>
      <label for="key">Admin key</label>
      <input id="key" type="password" placeholder="Admin key" autocomplete="off">
      <div class="err" id="keyErr"></div>
      <div class="foot"><span></span><button class="btn" id="open">Open ledger</button></div>
    </div>
  </section>

  <section id="list" class="hide">
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="cardhead">Candidates</div>
      <div id="tableBox"></div>
      <div class="foot">
        <button class="btn ghost" id="csv">Download CSV</button>
        <button class="btn ghost" id="refresh">Refresh</button>
      </div>
    </div>
    <p class="label" style="margin-top:16px">Click any row for that candidate's paper and every answer</p>
  </section>

  <section id="detail" class="hide">
    <div class="card">
      <div class="cardhead" id="dWho"></div>
      <div class="verdict">
        <div class="bigscore" id="dScore"></div>
        <div class="stamp" id="dStamp"></div>
      </div>
      <p class="label" id="dMeta" style="margin:20px 0 0;line-height:1.9"></p>
      <table style="margin-top:18px"><tbody id="dSections"></tbody></table>
      <div id="dSignals"></div>
      <div class="foot"><span></span><button class="btn ghost" id="back">Back to ledger</button></div>
    </div>
    <div class="label" style="margin:30px 0 14px">Their paper, question by question</div>
    <div id="dReview"></div>
  </section>

</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbw3CERsTbFcVYDY3tD6wmhE6hT7t2nJJf02oWQULVjtMpMsV6nTlim33-9HoxTlRhgZ/exec";

const $ = id => document.getElementById(id);
let rows = [], adminKey = "", sortKey = "score", sortDir = -1;

function call(params, attempt){
  attempt = attempt || 1;
  const base = (typeof VERIFY_ENDPOINT !== "undefined") ? VERIFY_ENDPOINT : ENDPOINT;
  const qs = Object.keys(params).map(k => encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
  return fetch(base + "?callback=cb&_=" + Date.now() + "_" + attempt + "&" + qs,
               { method:"GET", redirect:"follow", cache:"no-store" })
    .then(r => r.text())
    .then(t => {
      const s = String(t).trim();
      const m = s.match(/cb\(([\s\S]*)\)\s*;?\s*$/);
      if (m) return JSON.parse(m[1]);
      try { return JSON.parse(s); } catch (e) {}
      throw new Error("bad-response");
    })
    .catch(err => {
      /* Google's Apps Script front end intermittently answers with a 404 page
         instead of the data. It clears on a retry, so try a few times before
         troubling the person using this. */
      if (attempt < 4){
        return new Promise(r => setTimeout(r, attempt * 700))
          .then(() => call(params, attempt + 1));
      }
      throw new Error(err && err.message === "bad-response"
        ? "The service answered oddly three times. Wait a moment and try again."
        : (err && err.message ? err.message : String(err)));
    });
}

const fmt = s => `${Math.floor(s/60)}:${String(Math.round(s)%60).padStart(2,"0")}`;
const esc = s => String(s == null ? "" : s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const tone = label => (label === "Exceptional" || label === "Strong") ? "var(--olive)"
                    : label === "Average" ? "var(--leather)" : "var(--red)";

$("open").onclick = async () => {
  adminKey = $("key").value.trim();
  if (!adminKey){ $("keyErr").textContent = "ENTER THE ADMIN KEY"; return; }
  $("keyErr").textContent = "LOADING... FIRST LOAD CAN BE SLOW";
  await load();
};
$("key").addEventListener("keydown", e => { if (e.key === "Enter") $("open").click(); });
$("refresh").onclick = load;

async function load(){
  try{
    const r = await call({action:"admin", key:adminKey});
    if (!r || !r.ok){ $("keyErr").textContent = ((r && r.error) || "Wrong key.").toUpperCase(); return; }
    rows = r.rows || [];
    $("login").classList.add("hide");
    $("detail").classList.add("hide");
    $("list").classList.remove("hide");
    $("sub").textContent = rows.length + " completed";
    render();
  }catch(e){ $("keyErr").textContent = "FAILED: " + (e && e.message ? e.message : e); }
}

function render(){
  if (!rows.length){
    $("stats").innerHTML = "";
    $("tableBox").innerHTML = '<p class="muted">Nobody has completed the test yet.</p>';
    return;
  }
  const n = rows.length;
  const avg = rows.reduce((a,r)=>a+Number(r.score),0)/n;
  const top = Math.max.apply(null, rows.map(r=>Number(r.score)));
  const flagged = rows.filter(r=>Number(r.switches)+Number(r.copies||0)>0).length;
  const worth = rows.filter(r=>r.flags && r.flags.length).length;
  $("stats").innerHTML = `
    <div class="stat"><b>${n}</b><span>Completed</span></div>
    <div class="stat"><b>${avg.toFixed(1)}</b><span>Average score</span></div>
    <div class="stat"><b>${top}</b><span>Highest</span></div>
    <div class="stat"><b style="color:${flagged?"var(--red)":"inherit"}">${flagged}</b><span>Left tab or copied</span></div>
    <div class="stat"><b style="color:${worth?"var(--red)":"inherit"}">${worth}</b><span>Worth a second look</span></div>`;

  const sorted = rows.slice().sort((a,b)=>{
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === "when"){ x = new Date(x); y = new Date(y); }
    else if (sortKey !== "email" && sortKey !== "band"){ x = Number(x); y = Number(y); }
    return x > y ? sortDir : x < y ? -sortDir : 0;
  });

  $("tableBox").innerHTML = `<table>
    <thead><tr>
      <th data-k="email">Candidate</th>
      <th data-k="score" style="text-align:right">Score</th>
      <th data-k="raw" style="text-align:right" class="hcol">Correct</th>
      <th data-k="band">Rating</th>
      <th data-k="switches" style="text-align:right">Left tab</th>
      <th data-k="copies" style="text-align:right" class="hcol">Copy</th>
      <th>Review</th>
      <th data-k="time" style="text-align:right" class="hcol">Time</th>
      <th data-k="when" style="text-align:right" class="hcol">Taken</th>
    </tr></thead><tbody>` +
    sorted.map(r=>`<tr class="row" data-id="${esc(r.id)}">
        <td>${esc(r.email)}</td>
        <td class="n" style="text-align:right"><b>${r.score}</b><span class="muted">/${r.total}</span></td>
        <td class="n" style="text-align:right">${r.raw}</td>
        <td><span class="pill" style="color:${tone(r.band)}">${r.band}</span></td>
        <td class="n" style="text-align:right">${Number(r.switches) ? `<span class="flag">${r.switches}</span>` : "0"}</td>
        <td class="n" style="text-align:right">${Number(r.copies) ? `<span class="flag">${r.copies}</span>` : "0"}</td>
        <td>${(r.flags && r.flags.length) ? `<span class="warn">${r.flags.length} to check</span>` : '<span class="clean">clean</span>'}</td>
        <td class="n" style="text-align:right">${fmt(Number(r.time))}</td>
        <td class="n" style="text-align:right">${new Date(r.when).toLocaleDateString()}</td>
      </tr>`).join("") + `</tbody></table>`;

  document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
    render();
  });
  document.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
}

async function openDetail(id){
  $("list").classList.add("hide");
  $("detail").classList.remove("hide");
  window.scrollTo(0,0);
  $("dWho").textContent = "Loading paper...";
  $("dScore").textContent = ""; $("dStamp").textContent = "";
  $("dMeta").textContent = ""; $("dSections").innerHTML = ""; $("dReview").innerHTML = "";
  let r;
  try{ r = await call({action:"review", key:adminKey, id:id}); }
  catch(e){ $("dWho").textContent = "FAILED: " + (e && e.message ? e.message : e); return; }
  if (!r || !r.ok){ $("dWho").textContent = ((r && r.error) || "Could not load.").toUpperCase(); return; }

  $("dWho").textContent = r.email;
  $("dScore").innerHTML = `${r.score}<small>/${r.total}</small>`;
  $("dStamp").textContent = r.band[0].toUpperCase();
  $("dStamp").style.color = tone(r.band[0]);
  const flags = [];
  if (Number(r.switches)) flags.push(`left the tab ${r.switches}\u00D7`);
  if (Number(r.copies)) flags.push(`${r.copies} copy attempt${Number(r.copies)>1?"s":""}`);
  $("dMeta").innerHTML = `${r.raw} correct` +
    (Number(r.penalty) ? ` &middot; <span style="color:var(--red)">minus ${r.penalty} for ${flags.join(" and ")}</span>` : " &middot; nothing flagged") +
    ` &middot; ${fmt(Number(r.time))} total &middot; ${new Date(r.when).toLocaleString()}` +
    ` &middot; paper <span class="seq">${r.seed}</span>`;

  const secs = {};
  r.review.forEach(q => {
    if (!secs[q.s]) secs[q.s] = {n:0,c:0,t:0};
    secs[q.s].n++; secs[q.s].t += q.spent;
    if (q.ok) secs[q.s].c++;
  });
  $("dSections").innerHTML = Object.keys(secs).map(k=>{
    const v = secs[k], p = Math.round(v.c/v.n*100);
    return `<tr><td>${k}</td>
      <td class="n" style="text-align:right">${v.c} / ${v.n}</td>
      <td class="n" style="text-align:right;color:${p>=70?"var(--olive)":p>=50?"var(--leather)":"var(--red)"}"><b>${p}%</b></td>
      <td class="n muted" style="text-align:right">${fmt(v.t)}</td></tr>`;
  }).join("");

  const sg = r.signals || {flags:[]};
  const sigBox = document.getElementById("dSignals");
  if (sg.flags && sg.flags.length){
    sigBox.className = "signals";
    sigBox.innerHTML = `<div class="h">Worth asking about</div>
      <div class="muted" style="font-size:13.5px">None of this proves anything. Put it to them in the follow-up and listen to the answer.</div>
      <ul>${sg.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
      <div class="cool">Easy tier ${sg.easyPct}% correct &middot; hard tier ${sg.hardPct}% &middot;
        timing spread ${sg.spread}s &middot; ${sg.timedOut} ran out of time</div>`;
  } else {
    sigBox.className = "signals";
    sigBox.style.borderColor = "var(--olive)";
    sigBox.style.borderLeftColor = "var(--olive)";
    sigBox.style.background = "#F2F6F3";
    sigBox.innerHTML = `<div class="h" style="color:var(--olive)">Nothing unusual</div>
      <div class="cool">Easy tier ${sg.easyPct}% correct &middot; hard tier ${sg.hardPct}% &middot;
        timing spread ${sg.spread}s &middot; ${sg.timedOut} ran out of time</div>`;
  }

  $("dReview").innerHTML = r.review.map((q,i)=>`<div class="rev ${q.ok?"good":"bad"}">
      <span class="tag ${q.ok?"good":"bad"}">${q.given===null?"No answer":q.ok?"Correct":"Missed"} &middot; Q${String(i+1).padStart(2,"0")} &middot; ${q.d || q.s} &middot; ${q.s} &middot; ${fmt(q.spent)} of ${fmt(q.t)}</span>
      <h4>${q.q}</h4>
      ${q.o.map((o,j)=>{
        const isC = j === q.a, isG = j === q.given;
        const cls = isC && isG ? "both" : isC ? "correct" : isG ? "chosen" : "";
        const mark = isC && isG ? "\u2713 chosen, correct" : isC ? "\u2713 correct answer" : isG ? "\u2717 their answer" : "";
        return `<div class="opt ${cls}">${"ABCD"[j]}) ${o}${mark ? "  \u2014  " + mark : ""}</div>`;
      }).join("")}
      <p class="why">${q.w}</p>
    </div>`).join("");
}

$("back").onclick = () => {
  $("detail").classList.add("hide");
  $("list").classList.remove("hide");
  window.scrollTo(0,0);
};

$("csv").onclick = () => {
  const head = ["Email","Score","Out of","Correct","Penalty","Tab switches","Copy attempts","Rating","Time (sec)","Taken","Paper seed"];
  const body = rows.map(r => [r.email, r.score, r.total, r.raw, r.penalty, r.switches, r.copies,
    r.band, r.time, r.when, r.seed
  ].map(v => `"${String(v == null ? "" : v).replace(/"/g,'""')}"`).join(","));
  const blob = new Blob([head.join(",") + "\n" + body.join("\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "aptitude-results.csv";
  a.click();
};
</script>
